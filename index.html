<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Champel-Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono:wght@700&family=Bebas+Neue&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    html, body {
      width: 100%;
      height: 100%;
    }
 
    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
 
    .label {
      font-size: clamp(2.5rem, 8vw, 6rem);
      color: #111;
      opacity: 1;
      transition: opacity 0.4s ease;
      white-space: nowrap;
      user-select: none;
    }
 
    .label.fade-out {
      opacity: 0;
    }
 
    /* Les 3 styles */
    .font-rounded {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
 
    .font-serif {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.02em;
    }
 
    .font-mono {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
 
    .font-condensed {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      letter-spacing: 0.12em;
    }
 
    .font-script {
      font-family: 'Pacifico', cursive;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
 
 
  </style>
</head>
<body>
 
  <span class="label font-rounded" id="title">Champel-Tech</span>
 
  <script>
    const fonts = [
      { cls: 'font-rounded' },
      { cls: 'font-serif' },
      { cls: 'font-mono' },
      { cls: 'font-condensed' },
      { cls: 'font-script' },
    ];
 
    let current = 0;
    const el = document.getElementById('title');
 
    function switchFont() {
      el.classList.add('fade-out');
 
      setTimeout(() => {
        el.classList.remove(fonts[current].cls);
        current = (current + 1) % fonts.length;
        el.classList.add(fonts[current].cls);
        el.classList.remove('fade-out');
      }, 400);
    }
 
    setInterval(switchFont, 2200);
  </script>
 
</body>
</html>
